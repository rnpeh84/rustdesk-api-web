<!doctype html>
<html lang="ko" class="portainer-ui dark">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>삭제 버튼 미리보기 · Re;De</title></head>
  <body><div id="app"></div>
    <script type="module">
      import { createApp } from 'vue'
      import ElementPlus from 'element-plus'
      import ko from 'element-plus/es/locale/lang/ko'
      import { setActivePinia } from 'pinia'
      import { pinia } from '@/store'
      import 'element-plus/dist/index.css'
      import 'element-plus/theme-chalk/dark/css-vars.css'
      import '@/styles/style.scss'
      import '@/styles/portainer.scss'
      if (!import.meta.env.DEV) throw new Error('로컬 개발 전용 페이지입니다.')
      setActivePinia(pinia)
      const { default: Preview } = await import('./InlineConfirmationPreview.vue')
      createApp(Preview).use(pinia).use(ElementPlus, { locale: ko }).mount('#app')
    </script>
  </body>
</html>
